<!doctype html>
<meta charset="utf-8">
<title>Кадр коридора</title>
<!--
  Один кадр забега по заказу, без игры.

  Зачем: во-первых, посмотреть то, что в живом забеге поймать нечем — финишная
  табличка закрывается экраном результата через полсекунды после появления, и
  ровно на ней нашлась ошибка: табличка стояла посреди коридора и сливалась с
  воротами в жёлтую стену. Во-вторых, здесь же готовится init-картинка для
  Easy Diffusion.

  Контракт, который этот файл обслуживает: ГОРИЗОНТ НА 46% ВЫСОТЫ. Столько же
  у нашей проекции (HORIZON = H * 0.46). Фон с горизонтом в другом месте не
  сойдётся с полом, и стык будет виден сразу.

    ?finishIn=2.3                 — ворота и табличка
    ?kind=side&side=1&dt=1.8&u=-0.9 — боковое препятствие, ребёнок ушёл влево
    ?kind=duck&dt=1.2&look=ceiling — верхнее, вторая внешность (зубья)
    ?zone=kelpDeep&kind=side&side=1&look=jelly — своя внешность мира
                                    (floe, icicles, jelly, ribs, asteroid, comet)
    ?band=greenHill               — init-полоса для фонового растра зоны
                                    (?band=1 — то же для первой зоны)

  Полос теперь три, по одной на зону: небо у зон своё, иначе смена оформления
  посреди забега не достаёт до верхней половины кадра — именно это и заметил
  заказчик 10 октября.

  В консоли браузера:
    await saveFrame('tools/init/band-sunsetDunes.png')
    await toWebp('tools/painted/sky-sunset.png', 'assets/sky-sunset.webp', 0.82,
                 skyClamp('sunsetDunes'))
    // последний аргумент обязателен: без него облака останутся белыми.
    // Числом его не писать: потолок живёт в js/theme.js и у зон разный.

  Пиксельное небо (мир «Пиксельная страна»): ?pixel=8&colors=10 в адресе.
  Тогда toWebp перед зажимом уменьшает картинку в 8 раз ближайшим соседом и
  сводит её к 10 цветам медианным сечением. Увеличивать обратно не нужно:
  на экране растр растягивает drawImage без сглаживания.
    tools/frame.html?pixel=8&colors=10
    await toWebp('tools/painted/sky-pixel-day.png', 'assets/sky-pixel-day.webp',
                 1, skyClamp('pixelDay'))

  Инструмент разработки: в офлайн-кэш не попадает, tools/ туда не берут.

  Разбор: docs/sky-and-art.md
-->
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px system-ui; }
  canvas { display: block; width: 100vw; max-width: 1280px; }
  p { padding: 6px 10px; margin: 0; }
  .ruler { position: absolute; left: 0; width: 100%; height: 1px; background: #f0f; opacity: .6; }
  .wrap { position: relative; }
</style>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="ruler" id="ruler"></div>
</div>
<p id="info"></p>
<script type="module">
  import { createView, makeDecor, makeStars } from '../js/view.js';
  import { VIEW } from '../js/config.js';
  import { THEME, WORLDS, zonesOf, SKY_FILES, skyClamp } from '../js/theme.js';
  import { TROPHY, unlockedAt } from '../js/awards.js';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);

  const canvas = document.getElementById('c');
  canvas.width = VIEW.width;
  canvas.height = VIEW.height;

  /* Кладёт кадр в проект через POST /save в serve.js. Только для разработки. */
  window.saveFrame = async (path = 'tools/init/frame.png') => {
    const res = await fetch('/save', {
      method: 'POST',
      body: JSON.stringify({ path, dataUrl: canvas.toDataURL('image/png') }),
    });
    return { path, ...(await res.json()) };
  };

  /* PNG → WebP. Браузер здесь единственный доступный кодировщик: ни одного
     графического инструмента на машине нет. Разница не косметическая — в
     соседнем проекте тот же комплект весил 8.7 МБ в PNG против 170 КБ в WebP,
     а фон целиком уходит в офлайн-кэш к ребёнку. */
  /* Потолок светлоты по зоне — из темы, чтобы в строке запуска не оказалось
     копии числа без владельца. Разбор — у `skyClamp` в js/theme.js. */
  window.skyClamp = skyClamp;

  /* Светлота пикселя — та же формула, что у `luminance` в js/theme.js, но по
     трём каналам пикселя, а не по hex-строке. Второй копией правила это не
     является: правило одно, представление цвета разное. */
  const lin = (v) => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const pxLum = (r, g, b) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);

  const maxLum = (data) => {
    let m = 0;
    for (let i = 0; i < data.length; i += 4) {
      const L = pxLum(data[i], data[i + 1], data[i + 2]);
      if (L > m) m = L;
    }
    return m;
  };

  /* Зажим светлоты в gamma-пространстве: так цвет сохраняется, а светлота
     падает. Зажим по каналам порознь менял бы оттенок. */
  const clampPixels = (data, to) => {
    for (let i = 0; i < data.length; i += 4) {
      const L = pxLum(data[i], data[i + 1], data[i + 2]);
      if (L <= to) continue;
      const k = (to / L) ** (1 / 2.4);
      data[i] *= k; data[i + 1] *= k; data[i + 2] *= k;
    }
  };

  /* Пикселизация для пиксельного неба: модель сетку не держит, поэтому
     картинка уменьшается ближайшим соседом и сводится к малой палитре.
     Палитра — медианное сечение: ящик цветов делится пополам по самому
     широкому каналу, пока ящиков не станет N, цвет ящика — среднее. 16
     цветов в пробе 29 октября дали кашу в листве, 8–12 — честную сетку. */
  const PIXEL = num('pixel', 1);
  const COLORS = num('colors', 0);
  const quantize = (data, n) => {
    const px = [];
    for (let i = 0; i < data.length; i += 4) px.push([data[i], data[i + 1], data[i + 2]]);
    let boxes = [px];
    while (boxes.length < n) {
      let best = -1;
      let bestRange = -1;
      let bestCh = 0;
      boxes.forEach((b, bi) => {
        if (b.length < 2) return;
        for (let ch = 0; ch < 3; ch++) {
          let lo = 255;
          let hi = 0;
          for (const p of b) { if (p[ch] < lo) lo = p[ch]; if (p[ch] > hi) hi = p[ch]; }
          if (hi - lo > bestRange) { bestRange = hi - lo; best = bi; bestCh = ch; }
        }
      });
      if (best < 0 || bestRange <= 0) break;
      const b = boxes[best].sort((p, q) => p[bestCh] - q[bestCh]);
      const mid = b.length >> 1;
      boxes.splice(best, 1, b.slice(0, mid), b.slice(mid));
    }
    const pal = boxes.map((b) => [0, 1, 2].map((ch) => Math.round(b.reduce((s, p) => s + p[ch], 0) / b.length)));
    for (let i = 0; i < data.length; i += 4) {
      let bi = 0;
      let bd = Infinity;
      pal.forEach((c, k) => {
        const d = (data[i] - c[0]) ** 2 + (data[i + 1] - c[1]) ** 2 + (data[i + 2] - c[2]) ** 2;
        if (d < bd) { bd = d; bi = k; }
      });
      [data[i], data[i + 1], data[i + 2]] = pal[bi];
    }
    return pal.length;
  };

  window.toWebp = async (src, dest, quality = 0.82, clampTo = null) => {
    const img = new Image();
    img.src = '/' + src;
    await img.decode();
    const off = document.createElement('canvas');
    off.width = Math.round(img.naturalWidth / PIXEL);
    off.height = Math.round(img.naturalHeight / PIXEL);
    const octx = off.getContext('2d');
    octx.imageSmoothingEnabled = PIXEL === 1;
    octx.drawImage(img, 0, 0, off.width, off.height);
    const src0 = octx.getImageData(0, 0, off.width, off.height);
    if (COLORS > 0) quantize(src0.data, COLORS);

    /* Зажим светлоты, ПРОВЕРЕННЫЙ ПО ФАКТУ КОДИРОВАНИЯ.

       Нейросеть рисует облака чисто белыми, а белое — это светлота 1.0 при
       проёме 0.95: фон начинает спорить с каналом решения, то есть с
       сообщением «иди сюда». Правило то же, что у палитры в js/theme.js.

       Зажать перед кодированием НЕ ДОСТАТОЧНО, и это замерено 17 октября:
       WebP выталкивает самые светлые пиксели обратно вверх примерно на пятую
       часть ОТНОСИТЕЛЬНО потолка, а не на постоянные 0.047, как здесь
       считалось. Поэтому у всех двенадцати растров максимум стоял выше
       собственного потолка: у дневных зон 0.83–0.86 при 0.704, у ночных
       0.35–0.40 при 0.30. Зажатое перед кодированием число проверить было
       нечем — и его не проверяли.

       Теперь цикл: зажали, закодировали, ИЗМЕРИЛИ результат, и если он выше
       потолка — зажали строже на ту же долю. Сходится за один-три прохода.
       У самых тёмных зон остаётся хвост в сотые доли: кодировщик не умеет
       держать нижние значения точнее, и упираться в это бесконечно незачем —
       отсюда потолок проходов и допуск. Возвращается ДОСТИГНУТЫЙ максимум:
       число, которого не видно, — число, которому нельзя верить. */
    const PASSES = 4;
    const TOL = 1.03;
    let target = clampTo;
    let got = null;
    let dataUrl = null;
    for (let pass = 0; pass < (clampTo == null ? 1 : PASSES); pass++) {
      const d = new ImageData(new Uint8ClampedArray(src0.data), src0.width, src0.height);
      if (clampTo != null) clampPixels(d.data, target);
      octx.putImageData(d, 0, 0);
      dataUrl = off.toDataURL('image/webp', quality);
      if (clampTo == null) break;
      const back = new Image();
      back.src = dataUrl;
      await back.decode();
      const check = document.createElement('canvas');
      check.width = off.width; check.height = off.height;
      const cctx = check.getContext('2d');
      cctx.drawImage(back, 0, 0);
      got = maxLum(cctx.getImageData(0, 0, check.width, check.height).data);
      if (got <= clampTo * TOL) break;
      target *= clampTo / got;
    }

    const res = await fetch('/save', { method: 'POST', body: JSON.stringify({ path: dest, dataUrl }) });
    return {
      dest, w: off.width, h: off.height, clampTo,
      max: got === null ? null : Math.round(got * 1000) / 1000,
      ...(await res.json()),
    };
  };

  /* Замер светлоты собранных растров. Та проверка, которой не было: потолок
     сверялся только как число в теме, а сам файл не смотрел никто — и все
     двенадцать растров стояли выше своих потолков.

     Живёт здесь, а не в tests-control.mjs, по той же причине, по которой
     здесь живёт кодировщик: в node нет декодировщика картинок. Запускается
     одной строкой из консоли браузера, печатает таблицей. */
  window.skyAudit = async () => {
    const rows = [];
    for (const [zone, file] of Object.entries(SKY_FILES)) {
      const img = new Image();
      img.src = `/assets/${file}`;
      try { await img.decode(); } catch { rows.push({ зона: zone, файл: file, нет: true }); continue; }
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      const потолок = skyClamp(zone);
      const max = maxLum(x.getImageData(0, 0, c.width, c.height).data);
      rows.push({
        зона: zone,
        потолок: Math.round(потолок * 1000) / 1000,
        максимум: Math.round(max * 1000) / 1000,
        превышение: `${Math.round((max / потолок - 1) * 100)}%`,
        годен: max <= потолок * 1.03,
      });
    }
    console.table(rows);
    return rows;
  };

  const ruler = document.getElementById('ruler');
  const info = document.getElementById('info');
  const showRuler = () => { ruler.style.top = `${(canvas.clientHeight * 0.46).toFixed(1)}px`; };

  if (q.has('band')) {
    /* Зона полосы — ЛЮБАЯ зона палитры, а не только первого мира. `?band=1`
       оставлен и значит первую зону: так в README записан весь ритуал сборки
       фона, и ломать его ради единообразия незачем.

       Здесь стояло `zonesOf('hills')`, и со вторым миром это значило бы, что
       init-полосу для ледяных зон сделать нечем, то есть арт нового мира
       нечем начать. */
    const ZONES = Object.keys(THEME);
    const zone = ZONES.includes(q.get('band')) ? q.get('band') : zonesOf('hills')[0];
    const T = THEME[zone];
    /* Облака в init ЯРЧЕ палитры намеренно. Это не картинка игры, а подсказка
       модели: из бледного пятна она облака не вырастит. Светлоту потом
       зажимает `toWebp(..., clampTo)` — там, где это имеет значение. */
    const cloudHi = '#f4fbff';
    /* init-полоса для фонового растра — и это НЕ кадр коридора.

       Кадр здесь не годится: в нём запечены обрывы, а фон едет по горизонтали
       своим параллаксом, и коричневое поехало бы прямо в небо. Полоса — одно
       только небо с горизонтом на тех же 46%, по всей ширине. Сдвигать такую
       можно безнаказанно. */
    const ctx = canvas.getContext('2d');
    const W = VIEW.width;
    const hy = VIEW.height * 0.46;
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, T.sky);
    g.addColorStop(1, T.skyLow);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hy);
    ctx.fillStyle = T.hills;
    ctx.fillRect(0, hy, W, VIEW.height - hy);

    /* Полосе нужна КОМПОЗИЦИЯ, а не заливка. Проверено прямо здесь: от двух
       плоских прямоугольников модель не построила ни облака, ни деревьев —
       только сгладила градиент, потратив семь секунд впустую. В комиксе того
       же автора init всегда был векторной сценой; это то же самое правило.
       Поэтому грубые облака и горбы холмов рисуются здесь руками, а нейросеть
       делает из них мягкие — ровно то, чего вектор не умеет. */
    /* ── КОМПОЗИЦИЯ ПОЛОСЫ ЗАДАНА МОТИВОМ ЗОНЫ ──

       Здесь была лесенка из двух веток: «если звёзды — звёзды, иначе облака»,
       плюс добавка «если сияние — ленты». Два шаблона на двенадцать зон, и
       умолчанием служили облака со стволами — поэтому заросли ламинарии
       получили облака и пальмы, а светящаяся бездна, которой нужно было хоть
       что-то кроме звёзд, получила полярное сияние и луну ПОД ВОДОЙ. Обе
       картинки уехали в игру как есть: тёмные зоны собираются прямо из
       полосы, без нейросети (см. README), то есть «подсказка модели»
       оказалась конечным растром.

       Теперь мотив зоны (`skyMotif`) называет композицию ЦЕЛИКОМ, а зона без
       мотива роняет сборку. Умолчания нет нарочно: умолчание и было тем
       механизмом, который посадил пальмы на дно.

       Цвета кистей ЛОКАЛЬНЫЕ, как `cloudHi`: это содержимое растра, а не
       палитра игры, и ни одна фигура игры ими не красится. Приглушены они
       нарочно — зажим тёмных зон 0.30 гасит яркое пятно до серой кляксы.

       Всё детерминированно, без случайности: растр собирается один раз и
       обязан быть повторимым. */

    /* Звёзды: сетка с разными шагами по осям, чтобы не читалась решёткой.
       Края НЕ занимаются — полоса замощается, и звезда на самом краю после
       зеркального повтора встала бы парой. */
    const звёзды = (n = 44) => {
      ctx.fillStyle = T.starSky;
      for (let i = 0; i < n; i++) {
        const x = ((i * 7 + 2) % 41) / 41 * W * 0.98 + W * 0.01;
        const y = ((i * 13 + 5) % 29) / 29 * hy * 0.88;
        const s = 1.5 + ((i * 5) % 3);
        ctx.fillRect(x, y, s, s);
      }
    };
    /* Луна: одна и крупная. Без неё ночное небо холмов читается как шум из
       точек. Под водой и в космосе её нет — там она и была дефектом. */
    const луна = () => {
      ctx.fillStyle = T.starSky;
      ctx.beginPath();
      ctx.ellipse(W * 0.72, hy * 0.2, W * 0.018, hy * 0.032, 0, 0, Math.PI * 2);
      ctx.fill();
    };
    const облака = () => {
      ctx.fillStyle = cloudHi;
      for (const [cx, cy, r] of [[0.12, 0.42, 1], [0.34, 0.26, 0.7], [0.58, 0.47, 1.15], [0.8, 0.3, 0.85]]) {
        const x = cx * W;
        const y = cy * hy;
        const rw = W * 0.075 * r;
        const rh = hy * 0.1 * r;
        ctx.beginPath();
        ctx.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2);
        ctx.ellipse(x + rw * 0.8, y + rh * 0.35, rw * 0.65, rh * 0.8, 0, 0, Math.PI * 2);
        ctx.ellipse(x - rw * 0.7, y + rh * 0.4, rw * 0.55, rh * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
    /* Сияние. Было пять одинаковых трапеций в жёстко зашитом зелёном — и
       читались они плакатными полосами, а не сиянием, тем сильнее, что небо
       зоны почти чёрное (контраст порядка двадцатикратного). Теперь лент
       больше, они уже, у каждой два тона — ядро и кромка, — а нижние края
       стоят на разной высоте. Светлота по-прежнему 0.09–0.18, заметно ниже
       зажима 0.30, и он их не трогает. */
    const сияние = () => {
      /* Ленты ГАСНУТ книзу, и это главное. Пять одинаковых трапеций с резким
         нижним краем читались зелёными столбами — ровно то, на что
         пожаловался заказчик 18 октября. Прозрачность внизу делает из столба
         занавес, и делает её градиент, а не нейросеть: полоса обязана быть
         приемлемым небом сама по себе, иначе новый мир нельзя довести до
         зелёного без стороннего сервера.

         Ленты широкие и малоконтрастные: светлота 0.09–0.18 при зажиме 0.30,
         то есть он их не трогает. Цвета локальные, как `cloudHi`. */
      for (const [x, w, len, цвет] of [
        [0.04, 0.09, 0.52, '#2a6e55'],
        [0.19, 0.06, 0.40, '#235f4b'],
        [0.33, 0.12, 0.60, '#2b7a60'],
        [0.53, 0.05, 0.34, '#1f5544'],
        [0.64, 0.10, 0.48, '#2a7258'],
        [0.82, 0.07, 0.42, '#245f4c'],
      ]) {
        const x0 = W * x;
        const w0 = W * w;
        const low = hy * len;
        const g2 = ctx.createLinearGradient(0, 0, 0, low);
        g2.addColorStop(0, цвет + 'cc');
        g2.addColorStop(0.5, цвет + '88');
        g2.addColorStop(1, цвет + '00');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x0 + w0, 0);
        ctx.lineTo(x0 + w0 * 0.55 + W * 0.05, low);
        ctx.lineTo(x0 + W * 0.05, low);
        ctx.closePath();
        ctx.fill();
      }
    };
    /* Лучи света сверху — то, чем толща воды отличается от неба. Гаснут
       книзу и ПРОЗРАЧНЫ: непрозрачный луч читался белой полосой, то есть
       предметом, а не светом. Та же правка, что у сияния, и по той же
       причине. */
    const лучи = (цвет, n = 4) => {
      for (let i = 0; i < n; i++) {
        const x0 = W * (0.06 + i * (0.84 / n));
        const w0 = W * 0.035;
        const g4 = ctx.createLinearGradient(0, 0, 0, hy);
        g4.addColorStop(0, цвет + '66');
        g4.addColorStop(0.6, цвет + '26');
        g4.addColorStop(1, цвет + '00');
        ctx.fillStyle = g4;
        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x0 + w0, 0);
        ctx.lineTo(x0 + w0 * 1.8 + W * 0.07, hy);
        ctx.lineTo(x0 + W * 0.07, hy);
        ctx.closePath();
        ctx.fill();
      }
    };
    /* Стайка рыб: мелкие тёмные силуэты, занимают место облаков. Светлыми
       они читались обрывками бумаги — светлое пятно в воде это блик, а не
       тело. */
    const рыбы = (цвет, n = 14) => {
      ctx.fillStyle = цвет;
      for (let i = 0; i < n; i++) {
        const x = ((i * 11 + 3) % 37) / 37 * W * 0.9 + W * 0.05;
        const y = ((i * 17 + 7) % 23) / 23 * hy * 0.6 + hy * 0.08;
        const w = W * 0.011;
        const h = hy * 0.009;
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - w, y);
        ctx.lineTo(x - w * 2.1, y - h * 1.4);
        ctx.lineTo(x - w * 2.1, y + h * 1.4);
        ctx.closePath();
        ctx.fill();
      }
    };
    // Взвесь: мелкие точки в толще. Дают модели фактуру воды, а не воздуха.
    const взвесь = (цвет, n = 50) => {
      ctx.fillStyle = цвет;
      for (let i = 0; i < n; i++) {
        const x = ((i * 19 + 5) % 53) / 53 * W;
        const y = ((i * 23 + 11) % 31) / 31 * hy;
        ctx.fillRect(x, y, 2, 2);
      }
    };
    /* Биолюминесценция: редкие пятна света в толще. Радиальным градиентом,
       а не плоским эллипсом: плоский читался диском, то есть предметом, а
       свет предметом быть не должен. */
    const свечение = (цвет) => {
      for (const [cx, cy, r] of [[0.18, 0.62, 1.0], [0.42, 0.44, 0.7],
                                 [0.66, 0.66, 1.2], [0.86, 0.50, 0.8]]) {
        const x = cx * W;
        const y = cy * hy;
        const rad = W * 0.075 * r;
        const g3 = ctx.createRadialGradient(x, y, 0, x, y, rad);
        g3.addColorStop(0, цвет + 'cc');
        g3.addColorStop(0.5, цвет + '66');
        g3.addColorStop(1, цвет + '00');
        ctx.fillStyle = g3;
        ctx.beginPath();
        ctx.ellipse(x, y, rad, rad * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
    /* Медузы: якорь композиции бездны — без них пятна света не складываются
       ни во что. Купол и три нити; нити тонкие, но это init для нейросети, а
       не кадр игры, и правило Miracast к ним не относится. */
    const медузы = (цвет) => {
      ctx.fillStyle = цвет;
      for (const [cx, cy, r] of [[0.28, 0.26, 1.0], [0.62, 0.16, 0.72], [0.79, 0.34, 0.55]]) {
        const x = cx * W;
        const y = cy * hy;
        const rw = W * 0.030 * r;
        const rh = hy * 0.058 * r;
        ctx.beginPath();
        ctx.ellipse(x, y, rw, rh, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        for (const d of [-0.55, 0, 0.55]) {
          ctx.fillRect(x + rw * d - W * 0.002, y, W * 0.004, hy * 0.05 * r);
        }
      }
    };
    // Кометы: голова и сужающийся хвост.
    const кометы = (цвет) => {
      ctx.fillStyle = цвет;
      for (const [cx, cy, r] of [[0.22, 0.26, 1.0], [0.52, 0.52, 0.8], [0.78, 0.18, 1.2], [0.9, 0.62, 0.6]]) {
        const x = cx * W;
        const y = cy * hy;
        ctx.beginPath();
        ctx.ellipse(x, y, W * 0.009 * r, hy * 0.016 * r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x, y - hy * 0.014 * r);
        ctx.lineTo(x, y + hy * 0.014 * r);
        ctx.lineTo(x - W * 0.13 * r, y + hy * 0.055 * r);
        ctx.lineTo(x - W * 0.13 * r, y + hy * 0.045 * r);
        ctx.closePath();
        ctx.fill();
      }
    };
    /* Газовые массы туманности вместо луны. Радиальным градиентом, как
       свечение бездны: плоский эллипс читался воздушным шаром, а газу
       границы не положено. */
    const туманность = (цвет) => {
      for (const [cx, cy, rw, rh] of [[0.24, 0.38, 0.20, 0.30], [0.56, 0.24, 0.15, 0.22],
                                      [0.76, 0.54, 0.22, 0.26]]) {
        const x = cx * W;
        const y = cy * hy;
        const g5 = ctx.createRadialGradient(x, y, 0, x, y, W * rw);
        g5.addColorStop(0, цвет + 'cc');
        g5.addColorStop(0.45, цвет + '77');
        g5.addColorStop(1, цвет + '00');
        ctx.fillStyle = g5;
        ctx.beginPath();
        ctx.ellipse(x, y, W * rw, hy * rh, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
    /* Гряда холмов по линии горизонта: силуэт, из которого модели есть что
       вырастить. Под водой на её месте ленты ламинарии и кораллы, в космосе —
       зубчатый гребень: круглые горбы читаются холмами где угодно. */
    const гряда = () => {
      ctx.fillStyle = T.hills;
      for (let i = 0; i < 7; i++) {
        const x = (i + 0.5) * W / 7;
        const rw = W * (0.1 + 0.03 * (i % 3));
        const rh = hy * (0.1 + 0.05 * ((i + 1) % 3));
        ctx.beginPath();
        ctx.moveTo(x - rw, hy);
        ctx.quadraticCurveTo(x, hy - rh * 2, x + rw, hy);
        ctx.closePath();
        ctx.fill();
      }
    };
    const гребень = () => {
      ctx.fillStyle = T.hills;
      for (let i = 0; i < 9; i++) {
        const x = (i + 0.5) * W / 9;
        const rw = W * 0.075;
        const rh = hy * (0.08 + 0.06 * ((i * 2 + 1) % 3));
        ctx.beginPath();
        ctx.moveTo(x - rw, hy);
        ctx.lineTo(x, hy - rh);
        ctx.lineTo(x + rw, hy);
        ctx.closePath();
        ctx.fill();
      }
    };
    const ламинария = () => {
      ctx.fillStyle = T.hills;
      for (let i = 0; i < 11; i++) {
        const x = (i + 0.5) * W / 11;
        const w = W * (0.008 + 0.004 * (i % 3));
        const h = hy * (0.32 + 0.22 * ((i + 1) % 4));
        const вверх = W * 0.03 * (i % 2 ? 1 : -1);
        ctx.beginPath();
        ctx.moveTo(x - w, hy);
        ctx.lineTo(x + w, hy);
        ctx.quadraticCurveTo(x + w + вверх, hy - h * 0.5, x + w * 0.6 + вверх, hy - h);
        ctx.lineTo(x - w * 0.6 + вверх, hy - h);
        ctx.quadraticCurveTo(x - w + вверх, hy - h * 0.5, x - w, hy);
        ctx.closePath();
        ctx.fill();
      }
    };
    /* Кораллы по линии горизонта. Шляпка на ножке читалась грибом, поэтому
       форма ветвистая: короткий ствол и две-три лапы вверх, как у канделябра.
       Высоты разные — одинаковые читались забором. */
    const кораллы = () => {
      ctx.fillStyle = T.hills;
      for (let i = 0; i < 9; i++) {
        const x = (i + 0.5) * W / 9;
        const w = W * 0.009;
        const h = hy * (0.10 + 0.08 * (i % 3));
        ctx.fillRect(x - w, hy - h, w * 2, h);
        for (const d of [-1, 1]) {
          const y0 = hy - h * (d < 0 ? 0.45 : 0.68);
          ctx.beginPath();
          ctx.moveTo(x + d * w, y0);
          ctx.lineTo(x + d * w * 3.4, y0 - h * 0.1);
          ctx.lineTo(x + d * w * 3.4, y0 - h * 0.52);
          ctx.lineTo(x + d * w * 1.6, y0 - h * 0.42);
          ctx.closePath();
          ctx.fill();
        }
        if (i % 2) {
          ctx.beginPath();
          ctx.moveTo(x - w, hy - h);
          ctx.lineTo(x + w, hy - h);
          ctx.lineTo(x + w * 2.2, hy - h * 1.35);
          ctx.lineTo(x - w * 0.6, hy - h * 1.35);
          ctx.closePath();
          ctx.fill();
        }
      }
    };
    /* Стволы — только у ЗЕМНЫХ дневных зон. Прежде они рисовались по
       «нет звёзд», то есть доставались и мелководью, и зарослям, и вершине
       над облаками: пальмы над облаками — тот же дефект, что пальмы на дне,
       просто нейросеть их размягчила. */
    const стволы = () => {
      ctx.fillStyle = T.grassDark;
      for (let i = 0; i < 5; i++) {
        const x = (i + 0.3) * W / 5;
        ctx.fillRect(x, hy - hy * 0.1, W * 0.006, hy * 0.1);
        ctx.beginPath();
        ctx.ellipse(x + W * 0.003, hy - hy * 0.1, W * 0.022, hy * 0.022, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    const МОТИВ = {
      clouds: () => { облака(); гряда(); стволы(); },
      cloudsHigh: () => { облака(); гряда(); },
      night: () => { звёзды(); луна(); гряда(); },
      aurora: () => { сияние(); звёзды(); луна(); гряда(); },
      shallows: () => { лучи('#8fd4dc', 5); рыбы('#bfe6ea'); взвесь('#9fd8de', 30); кораллы(); },
      kelp: () => { лучи('#6fb8bc', 4); рыбы('#9fd2d6'); взвесь('#5fa0a6', 50); ламинария(); },
      abyss: () => { свечение('#14414a'); медузы('#2b6a74'); взвесь(T.starSky, 60); гребень(); },
      comet: () => { звёзды(60); кометы(T.starSky); гребень(); },
      nebula: () => { туманность(T.cloud); звёзды(60); гребень(); },
    };
    const рисовать = МОТИВ[T.skyMotif];
    if (!рисовать) throw new Error(`у зоны «${zone}» нет мотива неба (skyMotif)`);
    рисовать();

    showRuler();
    info.textContent = `init-полоса зоны «${T.name}» (${zone}) → assets/${SKY_FILES[zone]}, горизонт на 46%`;
  } else {
    // ?sky=1 готовит init-кадр для генерации — в нём фонового растра быть не
    // должно, иначе следующая генерация пойдёт от самой себя.
    const bare = q.has('sky');
    /* Растры приходят КАРТОЙ по зонам — небо меняется вместе с зоной.
       Недостающий файл просто не попадает в карту, и зона уходит на векторный
       путь: ровно то же, что в игре. */
    /* Зона кадра — ЛЮБАЯ зона палитры, по той же причине, что и у полосы:
       посмотреть кадр ледяного мира иначе нечем, а «проверено глазами» — это
       вывод этапа 2, где счётчик заливок двух отказов не увидел. */
    const ZONES = Object.keys(THEME);
    const zone = ZONES.includes(q.get('zone')) ? q.get('zone') : zonesOf('hills')[0];
    /* Мир зоны — чтобы обочина пришла из него же. Реестр один, искать по нему
       дешевле, чем заводить второй список «зона → мир». */
    const мирЗоны = Object.values(WORLDS)
      .find((w) => (w.zones || []).includes(zone))?.id || 'hills';
    const backdrops = {};
    if (!bare) {
      const im = new Image();
      im.src = `/assets/${SKY_FILES[zone]}`;
      try { await im.decode(); backdrops[zone] = im; } catch { /* нет файла — вектор */ }
    }

    const view = createView(canvas, { backdrops });
    const travel = num('travel', 7.5);
    const elapsed = num('elapsed', travel / VIEW.speed);

    // Препятствие по заказу: время до прихода задаётся прямо, чтобы посмотреть
    // любую отметку телеграфа, не дожидаясь её в забеге.
    const obstacles = [];
    if (q.get('kind')) {
      obstacles.push({
        kind: q.get('kind'),
        // Внешность по заказу: ?look=gate / ceiling. Без неё посмотреть вторую
        // внешность нечем, а именно на неё и жалуются глазами.
        look: q.get('look') || undefined,
        side: num('side', -1),
        at: elapsed + num('dt', 1.2),
        passed: false, hit: false, verdictAt: null,
      });
    }

    /* Призы кубка: `?prizes=rim,firefly,bloom,sparks` — или `?prizes=all`.
       Без них этот инструмент не мог показать НИ ОДИН приз, а именно им и
       проверяется «виден ли приз на экране» — урок этапа 2, где ободок
       оказался невидимым, а светлячки «пропали» из-за ошибки замера.
       Проверять приз одним счётчиком заливок нельзя: он считает вызовы
       отрисовки, а не картинку. Разбор — docs/trophy-and-worlds.md. */
    /* Список призов берётся у ВЛАДЕЛЬЦА — таблицы в js/awards.js, — а не
       пишется здесь третьей копией. Прежняя копия уже отстала: `?prizes=all`
       не знал про спутника и шлейф, то есть ритуал «проверено кадром» был
       ослеплён ровно для тех двух призов, ради которых он и нужен. Поймано
       ревью; на спутнике это стоило двух заходов. */
    const заказ = (q.get('prizes') || '').split(',').map((x) => x.trim()).filter(Boolean);
    const prizes = заказ.includes('all')
      ? unlockedAt(TROPHY[TROPHY.length - 1].at)
      : Object.fromEntries(заказ.map((имя) => [имя, true]));

    view.render({
      u: num('u', 0),
      v: num('v', 0),
      travel,
      elapsed,
      obstacles,
      prizes,
      stars: bare ? [] : makeStars({ durationS: 40 }),
      /* Обочина берётся из МИРА, которому принадлежит зона кадра. Без этого
         `?zone=snowField` показывал снежную палитру с пальмами и кактусом: сам
         декор генерировался для первого мира, а зона меняла только цвета
         кадра. Поймано глазами на первом же ледяном кадре. */
      decor: bare ? [] : makeDecor({ durationS: 40, prizes, world: мирЗоны }),
      safe: q.get('safe') !== '0',
      pulse: num('pulse', 1),
      finishIn: q.has('finishIn') ? num('finishIn', 1.2) : null,
      dim: 0,
      // Зона кадра: ?zone=nightHills. Иначе любой кадр смотрится в первой, и
      // посмотреть на закат или ночь было бы нечем.
      zone,
    });

    showRuler();
    info.textContent = `${VIEW.width}×${VIEW.height}, горизонт на 46% — розовая линия. `
      + `travel=${travel} elapsed=${elapsed.toFixed(2)}`;
  }
</script>
