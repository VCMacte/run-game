<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шустрик — восстановление профиля</title>
<!-- Одноразовый инструмент: вернуть профиль Матвея, пропавший 20 октября.

     Разбор: docs/log-and-storage.md

     Зачем страница, а не консоль. Прогресс лежит в localStorage, то есть
     привязан к origin; вернуть его может только код, исполняемый на том же
     origin. В установленном приложении адресной строки нет вовсе (правило
     проекта — см. CLAUDE.md, «Ручки для отладки»), а вкладка Chrome по тому
     же адресу делит с ним хранилище. Отсюда и форма: страница во вкладке
     пишет профиль, установленное приложение его читает.

     Почему данные внутри файла. Журнал телефона их больше не содержит:
     выгруженная сессия удаляется с устройства при следующей выгрузке
     (js/log.js), а все сессии до 19 октября выгружены. Числа живут только в
     logs/ на машине разработки, и донести их до телефона нечем, кроме этого
     файла. Решение заказчика.

     Страницу можно удалить, как только профиль вернулся: она одноразовая и
     больше ничему не служит. В офлайн-кэш она не попадает — tools/ не входит
     в список tools/make-sw.mjs, а sw.js отдаёт незнакомое в сеть. -->
<style>
  body { margin: 0; padding: 24px; font: 600 17px/1.5 system-ui, sans-serif;
         background: #0e1b24; color: #eaf4fa; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 12px 0; max-width: 34em; }
  .тихо { color: #9fb6c4; font-weight: 400; }
  button { font: 700 19px/1.2 system-ui, sans-serif; padding: 16px 22px; margin: 16px 0;
           border: 0; border-radius: 12px; background: #2fa06a; color: #fff; }
  button[disabled] { background: #3a4a55; color: #9fb6c4; }
  pre { background: #0a141b; padding: 14px; border-radius: 10px; overflow-x: auto;
        font: 400 14px/1.5 ui-monospace, monospace; color: #cfe3ef; white-space: pre-wrap; }
  .плохо { color: #ff9c8a; }
  .хорошо { color: #8ef0b4; }
</style>

<h1>Восстановление профиля</h1>
<p class="тихо">Матвей: копилка 970 колец и 14 записей, собранные из журналов
забегов. Калибровка и имя остаются ваши — дописываются только копилка и
таблица рекордов.</p>

<button id="go">Восстановить</button>
<pre id="out">Проверяю, что лежит в хранилище…</pre>

<script type="module">
/* Данные восстановления. Собраны из logs/ разбором событий bank (копилка,
   нарастающий итог) и record.save (записи). Поле starsTotal взято из
   run.start того же забега: там это stars.length, то есть ровно оно.

   Взяты только те записи, у которых журнал называет игроком Матвея. Шесть
   забегов 6–11 октября сделаны до появления профилей, имени в них нет, и
   приписать их кому-то нельзя — решение заказчика.

   Правило, которое здесь НЕ продублировано: у записей до 7 октября поле
   stars значило очки, и разделение восстанавливает migrateRecord в
   js/players.js. В этот набор такие записи не попали вовсе (они из
   безымянных), но правило названо, чтобы следующий его не переизобрёл. */
const ДАННЫЕ = {
  имя: 'Матвей',
  bank: 970,
  records: [
  {"at":1791724435595,"durationS":180,"stars":57,"starsTotal":59,"hits":1,"score":61,"step":0},
  {"at":1791724812953,"durationS":300,"stars":88,"starsTotal":100,"hits":1,"score":96,"step":0},
  {"at":1791741819258,"durationS":180,"stars":60,"starsTotal":67,"hits":2,"score":62,"step":0},
  {"at":1791984718221,"durationS":180,"stars":58,"starsTotal":67,"hits":1,"score":60,"step":0},
  {"at":1791985146015,"durationS":300,"stars":92,"starsTotal":97,"hits":0,"score":102,"step":0},
  {"at":1791985761509,"durationS":480,"stars":158,"starsTotal":175,"hits":1,"score":172,"step":0},
  {"at":1792337406000,"durationS":300,"stars":78,"starsTotal":98,"hits":3,"score":78,"step":0},
  {"at":1792337682110,"durationS":180,"stars":56,"starsTotal":58,"hits":0,"score":60,"step":1},
  {"at":1792338076275,"durationS":180,"stars":51,"starsTotal":58,"hits":0,"score":57,"step":1},
  {"at":1792345065186,"durationS":180,"stars":50,"starsTotal":55,"hits":0,"score":54,"step":1},
  {"at":1792345319341,"durationS":180,"stars":59,"starsTotal":62,"hits":0,"score":63,"step":1},
  {"at":1792429621259,"durationS":180,"stars":58,"starsTotal":60,"hits":0,"score":64,"step":1},
  {"at":1792429882697,"durationS":180,"stars":48,"starsTotal":52,"hits":1,"score":52,"step":1},
  {"at":1792430117228,"durationS":180,"stars":57,"starsTotal":60,"hits":0,"score":63,"step":1}
  ],
};

/* Ключи хранилища — строками, а не импортом из js/config.js. Страница обязана
   работать и тогда, когда с приложением что-то не так: она ровно для этого
   случая и написана. */
const ОСНОВНОЙ = 'run-game.players';
const КОПИЯ = 'run-game.players.bak';
/* Метка сделанного восстановления. Без неё второе нажатие удвоило бы копилку:
   записи защищены сверкой по at, а копилка — одно число, и сложить его дважды
   ничто бы не помешало. */
const МЕТКА = 'run-game.players.restored';

const out = document.getElementById('out');
const кнопка = document.getElementById('go');
function печать(текст, класс) {
  out.textContent = текст;
  out.className = класс || '';
}

function прочитать() {
  try { return JSON.parse(localStorage.getItem(ОСНОВНОЙ) || 'null'); } catch { return null; }
}

function найти(st) {
  return st?.list?.find((p) => String(p.name).toLowerCase() === ДАННЫЕ.имя.toLowerCase());
}

function осмотр() {
  const когда = localStorage.getItem(МЕТКА);
  if (когда) {
    кнопка.disabled = true;
    печать('Восстановление уже сделано ' + когда + '.\nПовторять нельзя: копилка удвоится.', 'хорошо');
    return;
  }
  const st = прочитать();
  if (!st || !Array.isArray(st.list)) {
    кнопка.disabled = true;
    печать('В этом браузере профиля нет вовсе.\n\nЗначит открыто не по тому адресу: страница '
      + 'обязана быть на том же origin, что и приложение.\nСейчас это ' + location.origin
      + '\nа игра установлена с https://vcmacte.github.io', 'плохо');
    return;
  }
  const кто = найти(st);
  if (!кто) {
    кнопка.disabled = true;
    печать('Игрока «' + ДАННЫЕ.имя + '» в профиле нет.\nЕсть: '
      + st.list.map((p) => p.name).join(', ')
      + '\n\nСоздайте его в игре под этим именем и откройте страницу снова.', 'плохо');
    return;
  }
  печать('Нашёл игрока «' + кто.name + '»:\n'
    + '  копилка сейчас: ' + (кто.bank || 0) + '\n'
    + '  записей сейчас: ' + (кто.records || []).length + '\n'
    + '  калибровка: ' + (кто.calib ? 'есть, сохраню' : 'нет') + '\n\n'
    + 'После восстановления: копилка ' + ((кто.bank || 0) + ДАННЫЕ.bank)
    + ', записей ' + ((кто.records || []).length + ДАННЫЕ.records.length) + '.');
}

кнопка.onclick = () => {
  /* Метка проверяется ЗДЕСЬ, а не только в осмотре. Выключенная кнопка —
     показ правила, а не само правило: поймано прогоном, где кнопку включили
     обратно и копилка стала 1940. Полагаться на состояние кнопки нельзя —
     второй вкладкой или отладчиком его обходят, а удвоенную копилку потом
     нечем отличить от настоящей. */
  if (localStorage.getItem(МЕТКА)) { осмотр(); return; }
  const st = прочитать();
  const кто = найти(st);
  if (!кто) { осмотр(); return; }

  const былаКопилка = кто.bank || 0;
  const былиЗаписи = Array.isArray(кто.records) ? кто.records : [];
  /* Сверка по at: отметка времени у записи уникальна, и ею же таблица разводит
     равные забеги. Открытую дважды страницу это держит и без метки. */
  const есть = new Set(былиЗаписи.map((r) => r.at));
  кто.bank = былаКопилка + ДАННЫЕ.bank;
  кто.records = [...былиЗаписи, ...ДАННЫЕ.records.filter((r) => !есть.has(r.at))];

  const json = JSON.stringify(st);
  try {
    localStorage.setItem(ОСНОВНОЙ, json);
  } catch (e) {
    печать('Записать не удалось: ' + e.name + '.\nПрофиль не изменён.', 'плохо');
    return;
  }
  /* Копия — по тем же правилам, что в js/players.js: профиль живёт в двух
     ключах, и восстановленный не исключение. Отказ копии отказом не считается,
     отвечает основной ключ. */
  try { localStorage.setItem(КОПИЯ, json); } catch { /* страховка не легла */ }
  localStorage.setItem(МЕТКА, new Date().toISOString().slice(0, 16).replace('T', ' '));

  кнопка.disabled = true;
  печать('Готово.\n'
    + '  копилка: ' + былаКопилка + ' → ' + кто.bank + '\n'
    + '  записей: ' + былиЗаписи.length + ' → ' + кто.records.length + '\n'
    + '  калибровка: ' + (кто.calib ? 'на месте' : 'её и не было') + '\n\n'
    + 'Откройте игру. Журнал запишет событие players.read с копилкой '
    + кто.bank + ' — по нему и видно, что восстановление дошло.', 'хорошо');
};

осмотр();
</script>
